# IRON WARFARE — production Ollama proxy (https site, empty "Ollama base URL")
#
# Symptom without this: model dropdown only shows mistral:7b, logs show
# "Ollama 405" — the browser must reach Ollama via same-origin paths that
# your host forwards to http://127.0.0.1:11434 (Ollama default).
#
# Copy the location blocks into the same server { } that serves index.html
# from dist/. Remove any old /api/llm/ollama* rules — they broke GET /tags.
#
# On the Ollama machine, allow your game origin, e.g.:
#   OLLAMA_ORIGINS=https://your-game.example,http://localhost:3000
#
# If the app is deployed under a subpath (import.meta.env.BASE_URL), mirror
# that prefix in location paths, e.g. location = /myapp/api/ollama-tags { ... }

location = /api/ollama-tags {
  proxy_pass http://127.0.0.1:11434/api/tags;
  proxy_http_version 1.1;
  proxy_set_header Host localhost;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /api/ollama-generate {
  proxy_pass http://127.0.0.1:11434/api/generate;
  proxy_http_version 1.1;
  proxy_set_header Host localhost;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 300s;
  proxy_buffering off;
}
